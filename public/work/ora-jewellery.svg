<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 990" role="img" aria-labelledby="title desc">
  <title id="title">ORA Jewellery concept direction</title>
  <desc id="desc">A dark editorial jewellery retail concept with a sculptural gold ring, collection navigation and considered e-commerce call to action.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171613"/><stop offset=".55" stop-color="#29261f"/><stop offset="1" stop-color="#0e0e0c"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#d5b66b" stop-opacity=".3"/><stop offset="1" stop-color="#d5b66b" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0aa"/><stop offset=".35" stop-color="#b9822b"/><stop offset=".67" stop-color="#f3d77b"/><stop offset="1" stop-color="#865d1e"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1584" height="990" fill="url(#night)"/>
  <circle cx="1130" cy="495" r="390" fill="url(#halo)" filter="url(#soft)"/>
  <path d="M0 820h1584" stroke="#d1b46d" stroke-opacity=".25"/>
  <text x="118" y="150" fill="#f1eadc" font-family="Arial,sans-serif" font-size="20" letter-spacing="10">ORA / OBJECTS OF MEANING</text>
  <text x="118" y="360" fill="#f1eadc" font-family="Georgia,serif" font-size="122" font-style="italic">Wear the</text>
  <text x="118" y="478" fill="#d8b96f" font-family="Georgia,serif" font-size="122">moment.</text>
  <text x="123" y="565" fill="#aaa598" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">CURATED JEWELLERY / MADE TO LAST</text>
  <rect x="118" y="655" width="210" height="58" rx="29" fill="#e0c47a"/>
  <text x="169" y="691" fill="#171613" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">SHOP THE EDIT</text>
  <g transform="translate(1010 170)">
    <circle cx="250" cy="250" r="196" fill="none" stroke="#584a2d" stroke-width="44" opacity=".35" filter="url(#soft)"/>
    <circle cx="250" cy="250" r="172" fill="none" stroke="url(#gold)" stroke-width="34"/>
    <circle cx="250" cy="250" r="115" fill="none" stroke="#ffeaa1" stroke-opacity=".34" stroke-width="3"/>
    <path d="M390 112c38 33 64 80 70 132" fill="none" stroke="#fff0ad" stroke-width="8" stroke-linecap="round" opacity=".8"/>
    <circle cx="250" cy="78" r="21" fill="#f5dc88" stroke="#fff1b0" stroke-width="6"/>
    <ellipse cx="250" cy="476" rx="225" ry="30" fill="#000" opacity=".45"/>
  </g>
  <text x="118" y="900" fill="#aaa598" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">COLLECTIONS / STORY / TRUST / DELIVERY</text>
