name: Sync fork with upstream

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'iwannis0/found-digital-growth'
    steps:
      - name: Merge upstream main into this fork's main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/merge-upstream" -f branch=main
